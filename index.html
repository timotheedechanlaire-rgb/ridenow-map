<!DOCTYPE html>

<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>RideNow Paris</title>

    <link
        href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css"
        rel="stylesheet"
    >

    <script
        src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js">
    </script>


    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {

            margin: 0;

            width: 100%;
            height: 100%;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;
        }

        #map {

            width: 100%;
            height: 100%;
        }


        /* =========================
           HEADER
        ========================= */

        .header {

            position: absolute;

            z-index: 10;

            top: 12px;
            left: 12px;
            right: 12px;

            padding: 13px 15px;

            border-radius: 15px;

            background:
                rgba(5, 28, 22, 0.94);

            color: white;

            backdrop-filter: blur(8px);

            box-shadow:
                0 3px 15px
                rgba(0,0,0,.15);
        }


        .brand {

            font-size: 21px;

            font-weight: 850;

            letter-spacing: -0.5px;
        }


        .brand span {

            color: #42d267;
        }


        .subtitle {

            margin-top: 3px;

            font-size: 12px;

            opacity: 0.8;
        }


        .top-row {

            margin-top: 9px;

            display: flex;

            gap: 8px;

            align-items: center;

            flex-wrap: wrap;
        }


        .status {

            font-size: 12px;

            font-weight: 600;
        }


        .live-badge {

            padding: 4px 8px;

            border-radius: 20px;

            background:
                rgba(255,255,255,.1);

            font-size: 11px;
        }


        /* =========================
           POSITION
        ========================= */

        .location-button {

            position: absolute;

            z-index: 10;

            right: 12px;

            bottom: 110px;

            border: none;

            border-radius: 50%;

            width: 48px;
            height: 48px;

            background: #072c22;

            color: white;

            font-size: 22px;

            cursor: pointer;

            box-shadow:
                0 3px 12px
                rgba(0,0,0,.25);
        }


        /* =========================
           LÉGENDE
        ========================= */

        .legend {

            position: absolute;

            z-index: 10;

            left: 12px;

            bottom: 18px;

            padding: 10px 12px;

            background:
                rgba(255,255,255,.95);

            border-radius: 12px;

            font-size: 11px;

            box-shadow:
                0 3px 12px
                rgba(0,0,0,.15);
        }


        .legend div {

            margin: 3px 0;
        }


        .legend-title {

            font-weight: 800;

            margin-bottom: 5px;
        }


        /* =========================
           MARQUEURS LIVE
        ========================= */

        .marker {

            width: 42px;
            height: 42px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: white;

            border:
                3px solid #073428;

            font-size: 23px;

            cursor: pointer;

            box-shadow:
                0 2px 9px
                rgba(0,0,0,.35);

            transition:
                transform .15s ease;
        }


        .marker:hover {

            transform: scale(1.12);
        }


        .marker.confirmed {

            border-color: #19a74d;
        }


        /* =========================
           POPUP
        ========================= */

        .popup-title {

            font-weight: 750;

            font-size: 14px;

            margin-bottom: 7px;
        }


        .popup-location {

            font-size: 13px;

            margin-bottom: 7px;
        }


        .popup-meta {

            font-size: 12px;

            line-height: 1.5;

            color: #555;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .header {

                top: 8px;
                left: 8px;
                right: 8px;
            }


            .brand {

                font-size: 19px;
            }


            .legend {

                left: 8px;
                bottom: 8px;
            }

        }

    </style>

</head>


<body>


<!-- =============================
     HEADER
============================= -->

<div class="header">

    <div class="brand">

        RIDE<span>NOW</span> PARIS 🚲

    </div>


    <div class="subtitle">

        Les infos des cyclistes,
        en temps réel.

    </div>


    <div class="top-row">

        <div
            class="status"
            id="status"
        >

            Chargement…

        </div>


        <div class="live-badge">

            🔄 Live · 15 sec

        </div>

    </div>

</div>



<!-- =============================
     CARTE
============================= -->

<div id="map"></div>



<!-- =============================
     MA POSITION
============================= -->

<button
    class="location-button"
    id="locationButton"
    title="Ma position"
>

    📍

</button>



<!-- =============================
     LÉGENDE
============================= -->

<div class="legend">

    <div class="legend-title">

        ALERTES LIVE

    </div>

    <div>
        🚧 Travaux
    </div>

    <div>
        ⚠️ Danger
    </div>

    <div>
        💥 Accident
    </div>

    <div>
        👮 Sécurité routière
    </div>


    <div
        style="
            margin-top:8px;
            border-top:1px solid #ddd;
            padding-top:7px;
        "
    >

        🔥 <b>Tendance 7 jours</b>

        <br>

        <span style="color:#666;">

            Activité récente signalée

        </span>

    </div>

</div>



<script>


/* =========================================================
   INITIALISATION CARTE
========================================================= */

const map = new maplibregl.Map({

    container: "map",

    style:
        "https://tiles.openfreemap.org/styles/liberty",

    center: [
        2.3522,
        48.8566
    ],

    zoom: 12.5

});


map.addControl(

    new maplibregl.NavigationControl(),

    "bottom-right"

);



/* =========================================================
   VARIABLES
========================================================= */

let markers = [];

let userMarker = null;



/* =========================================================
   EMOJIS
========================================================= */

function emojiFromCategory(category) {

    const text =
        category.toLowerCase();


    if (
        text.includes("travaux")
        ||
        text.includes("bloquée")
    ) {

        return "🚧";
    }


    if (
        text.includes("danger")
    ) {

        return "⚠️";
    }


    if (
        text.includes("accident")
    ) {

        return "💥";
    }


    if (
        text.includes("sécurité routière")
        ||
        text.includes("police")
        ||
        text.includes("contrôle")
    ) {

        return "👮";
    }


    return "❓";
}



/* =========================================================
   TEMPS ÉCOULÉ
========================================================= */

function timeAgo(dateString) {

    const date =
        new Date(dateString);


    const now =
        new Date();


    const seconds =
        Math.floor(
            (now - date) / 1000
        );


    if (seconds < 60) {

        return "à l'instant";
    }


    const minutes =
        Math.floor(
            seconds / 60
        );


    if (minutes < 60) {

        return `il y a ${minutes} min`;
    }


    const hours =
        Math.floor(
            minutes / 60
        );


    if (hours < 24) {

        return `il y a ${hours} h`;
    }


    const days =
        Math.floor(
            hours / 24
        );


    return `il y a ${days} j`;
}



/* =========================================================
   SUPPRIMER LES ANCIENS MARKERS
========================================================= */

function clearMarkers() {

    markers.forEach(
        marker => marker.remove()
    );


    markers = [];
}



/* =========================================================
   ALERTES LIVE
========================================================= */

async function loadAlerts() {

    try {

        const response =
            await fetch(
                "/api/alerts"
            );


        if (!response.ok) {

            throw new Error(
                "Erreur API alerts"
            );
        }


        const data =
            await response.json();


        clearMarkers();


        data.alerts.forEach(
            alert => {


                const element =
                    document.createElement(
                        "div"
                    );


                element.className =
                    "marker";


                if (
                    alert.confirmations >= 2
                ) {

                    element.classList.add(
                        "confirmed"
                    );
                }


                element.textContent =
                    emojiFromCategory(
                        alert.category
                    );


                const validationStatus =

                    alert.confirmations >= 2

                    ? "🟢 Confirmé par la communauté"

                    : "🟠 En attente de confirmation";


                const popup =

                    new maplibregl.Popup({
                        offset: 26
                    })


                    .setHTML(
                        `

                        <div class="popup-title">

                            ${
                                emojiFromCategory(
                                    alert.category
                                )
                            }

                            ${alert.category}

                        </div>


                        <div class="popup-location">

                            📍
                            ${alert.location_name}

                        </div>


                        <div class="popup-meta">

                            ${validationStatus}

                            <br>

                            👥
                            ${alert.confirmations}
                            confirmation(s)

                            <br>

                            🕒
                            ${timeAgo(
                                alert.created_at
                            )}

                        </div>

                        `
                    );


                const marker =

                    new maplibregl.Marker({
                        element: element
                    })


                    .setLngLat([

                        Number(
                            alert.longitude
                        ),

                        Number(
                            alert.latitude
                        )

                    ])


                    .setPopup(
                        popup
                    )


                    .addTo(
                        map
                    );


                markers.push(
                    marker
                );

            }
        );


        const statusElement =
            document.getElementById(
                "status"
            );


        if (
            data.alerts.length === 0
        ) {

            statusElement.textContent =
                "🟢 Aucune alerte active";
        }

        else {

            statusElement.textContent =
                `🔴 ${
                    data.alerts.length
                } alerte(s) active(s)`;
        }

    }

    catch (error) {

        console.error(
            "Erreur alerts:",
            error
        );


        document.getElementById(
            "status"
        ).textContent =

            "⚠️ Impossible de charger les alertes";

    }

}



/* =========================================================
   HISTORIQUE 7 JOURS
========================================================= */

async function loadHistory() {

    try {

        const response =
            await fetch(
                "/api/history"
            );


        if (!response.ok) {

            throw new Error(
                "Erreur API history"
            );
        }


        const data =
            await response.json();


        const now =
            Date.now();


        const features =
            data.alerts.map(
                alert => {


                    const created =
                        new Date(
                            alert.created_at
                        ).getTime();


                    const ageHours =
                        Math.max(
                            0,

                            (
                                now - created
                            )

                            /

                            (
                                1000
                                *
                                60
                                *
                                60
                            )
                        );


                    /*
                    Plus l'alerte est récente,
                    plus son poids est élevé.

                    0h  -> environ 1
                    7j  -> environ 0.15
                    */

                    const recencyWeight =
                        Math.max(

                            0.15,

                            1 -
                            (
                                ageHours
                                /
                                168
                            )

                        );


                    /*
                    Une alerte confirmée
                    pèse davantage.
                    */

                    const confirmationWeight =
                        Math.min(

                            2.5,

                            1 +
                            (
                                Number(
                                    alert.confirmations
                                )
                                *
                                0.25
                            )

                        );


                    const weight =
                        recencyWeight
                        *
                        confirmationWeight;


                    return {

                        type:
                            "Feature",


                        geometry: {

                            type:
                                "Point",

                            coordinates: [

                                Number(
                                    alert.longitude
                                ),

                                Number(
                                    alert.latitude
                                )

                            ]

                        },


                        properties: {

                            weight:
                                weight,

                            category:
                                alert.category

                        }

                    };

                }
            );


        const geojson = {

            type:
                "FeatureCollection",

            features:
                features
        };


        /*
        Si la source existe déjà,
        on actualise simplement
        ses données.
        */

        if (
            map.getSource(
                "history"
            )
        ) {

            map
                .getSource(
                    "history"
                )
                .setData(
                    geojson
                );


            return;
        }


        /*
        Création de la source
        historique.
        */

        map.addSource(

            "history",

            {

                type:
                    "geojson",

                data:
                    geojson

            }

        );


        /*
        HEATMAP

        Plusieurs signalements
        proches géographiquement
        vont naturellement
        augmenter l'intensité
        de la zone.
        */

        map.addLayer({

            id:
                "history-heat",


            type:
                "heatmap",


            source:
                "history",


            maxzoom:
                16,


            paint: {


                "heatmap-weight":

                    [
                        "interpolate",

                        [
                            "linear"
                        ],

                        [
                            "get",
                            "weight"
                        ],

                        0,
                        0,

                        2.5,
                        1
                    ],


                "heatmap-intensity":

                    [
                        "interpolate",

                        [
                            "linear"
                        ],

                        [
                            "zoom"
                        ],

                        10,
                        0.6,

                        13,
                        1,

                        16,
                        1.8
                    ],


                "heatmap-radius":

                    [
                        "interpolate",

                        [
                            "linear"
                        ],

                        [
                            "zoom"
                        ],

                        10,
                        15,

                        13,
                        25,

                        16,
                        40
                    ],


                "heatmap-opacity":

                    [
                        "interpolate",

                        [
                            "linear"
                        ],

                        [
                            "zoom"
                        ],

                        10,
                        0.40,

                        15,
                        0.60
                    ]

            }

        });

    }

    catch (error) {

        console.error(
            "Erreur historique:",
            error
        );

    }

}



/* =========================================================
   GÉOLOCALISATION
========================================================= */

document
    .getElementById(
        "locationButton"
    )
    .addEventListener(

        "click",

        () => {


            if (
                !navigator.geolocation
            ) {

                alert(
                    "La géolocalisation n'est pas disponible sur cet appareil."
                );

                return;
            }


            navigator.geolocation.getCurrentPosition(

                position => {


                    const lat =
                        position.coords.latitude;


                    const lon =
                        position.coords.longitude;


                    /*
                    Centre la carte
                    sur l'utilisateur.
                    */

                    map.flyTo({

                        center: [
                            lon,
                            lat
                        ],

                        zoom:
                            15.5

                    });


                    /*
                    Supprime l'ancien
                    marqueur utilisateur.
                    */

                    if (
                        userMarker
                    ) {

                        userMarker.remove();
                    }


                    /*
                    Point bleu
                    représentant
                    l'utilisateur.
                    */

                    const element =
                        document.createElement(
                            "div"
                        );


                    element.style.width =
                        "18px";


                    element.style.height =
                        "18px";


                    element.style.borderRadius =
                        "50%";


                    element.style.background =
                        "#2478ff";


                    element.style.border =
                        "4px solid white";


                    element.style.boxShadow =
                        "0 2px 8px rgba(0,0,0,.35)";


                    userMarker =

                        new maplibregl.Marker({
                            element: element
                        })


                        .setLngLat([
                            lon,
                            lat
                        ])


                        .addTo(
                            map
                        );

                },


                () => {

                    alert(
                        "Impossible d'obtenir ta position. Vérifie les autorisations de localisation."
                    );

                },


                {

                    enableHighAccuracy:
                        true,

                    timeout:
                        10000,

                    maximumAge:
                        30000

                }

            );

        }

    );



/* =========================================================
   LANCEMENT
========================================================= */

map.on(

    "load",

    async () => {


        /*
        Charge d'abord
        l'historique.
        */

        await loadHistory();


        /*
        Puis les alertes live
        au-dessus.
        */

        await loadAlerts();


        /*
        Mise à jour des alertes
        toutes les 15 secondes.
        */

        setInterval(

            loadAlerts,

            15000

        );


        /*
        Mise à jour de la tendance
        toutes les 5 minutes.
        */

        setInterval(

            loadHistory,

            300000

        );

    }

);


</script>


</body>

</html>
