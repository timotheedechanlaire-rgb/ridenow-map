<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>RideNow Paris</title>

    <link
        href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css"
        rel="stylesheet"
    >

    <script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;
        }

        body {
            background: #f4f4f4;
        }

        #app {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #map {
            position: absolute;
            inset: 0;
        }

        /* =================================================
           HEADER NORMAL
        ================================================= */

        #header {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            z-index: 10;

            background: rgba(255, 255, 255, 0.96);
            border-radius: 18px;
            padding: 13px 15px;

            box-shadow:
                0 4px 20px rgba(0, 0, 0, 0.12);
        }

        .brand {
            font-size: 20px;
            font-weight: 800;
        }

        .subtitle {
            margin-top: 2px;
            font-size: 12px;
            opacity: 0.65;
        }

        #alert-count {
            margin-top: 7px;
            font-size: 13px;
            font-weight: 700;
        }

        /* =================================================
           LEGEND
        ================================================= */

        #legend {
            position: absolute;
            left: 12px;
            bottom: 18px;
            z-index: 10;

            background: rgba(255, 255, 255, 0.94);
            border-radius: 15px;
            padding: 10px 12px;

            box-shadow:
                0 4px 18px rgba(0, 0, 0, 0.12);

            font-size: 12px;
            line-height: 1.7;
        }

        /* =================================================
           GEO BUTTON
        ================================================= */

        #geo-button {
            position: absolute;
            right: 12px;
            bottom: 20px;
            z-index: 15;

            width: 48px;
            height: 48px;

            border: none;
            border-radius: 50%;

            background: white;

            font-size: 23px;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.18);

            cursor: pointer;
        }

        /* =================================================
           LOCATION SELECTOR
        ================================================= */

        #selector-ui {
            display: none;
        }

        body.selection-mode #header,
        body.selection-mode #legend {
            display: none;
        }

        body.selection-mode #selector-ui {
            display: block;
        }

        body.selection-mode #geo-button {
            bottom: 112px;
        }

        #selector-header {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;

            z-index: 20;

            background: rgba(255, 255, 255, 0.97);

            border-radius: 18px;

            padding: 13px 16px;

            box-shadow:
                0 4px 20px rgba(0, 0, 0, 0.13);

            text-align: center;
        }

        #selector-title {
            font-size: 17px;
            font-weight: 800;
        }

        #selector-subtitle {
            margin-top: 4px;
            font-size: 12px;
            opacity: 0.65;
        }

        /*
        Le pin est FIXE.
        C'est la carte que l'utilisateur déplace dessous.
        */

        #center-pin {
            position: absolute;

            left: 50%;
            top: 50%;

            z-index: 25;

            transform:
                translate(-50%, -100%);

            pointer-events: none;
        }

        #center-pin-icon {
            font-size: 46px;

            filter:
                drop-shadow(
                    0 4px 4px rgba(0, 0, 0, 0.30)
                );

            line-height: 1;
        }

        #pin-dot {
            position: absolute;

            left: 50%;
            top: 50%;

            width: 8px;
            height: 8px;

            background: rgba(0, 0, 0, 0.22);

            border-radius: 50%;

            transform:
                translate(-50%, 19px);

            box-shadow:
                0 0 0 7px rgba(0, 0, 0, 0.05);
        }

        #selector-bottom {
            position: absolute;

            left: 12px;
            right: 12px;
            bottom: 14px;

            z-index: 30;

            background: rgba(255, 255, 255, 0.98);

            border-radius: 20px;

            padding: 12px;

            box-shadow:
                0 5px 24px rgba(0, 0, 0, 0.18);
        }

        #chosen-position {
            text-align: center;

            font-size: 12px;

            margin-bottom: 9px;

            opacity: 0.65;
        }

        #confirm-location {
            width: 100%;

            border: none;
            border-radius: 14px;

            padding: 15px 12px;

            background: #111;

            color: white;

            font-size: 15px;
            font-weight: 800;

            cursor: pointer;
        }

        #confirm-location:active {
            transform: scale(0.99);
        }

        /* =================================================
           MARKERS
        ================================================= */

        .alert-marker {
            width: 40px;
            height: 40px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: white;

            box-shadow:
                0 3px 12px rgba(0, 0, 0, 0.25);

            font-size: 22px;

            cursor: pointer;

            border: 2px solid rgba(0, 0, 0, 0.08);
        }

        .maplibregl-popup-content {
            border-radius: 14px;
            padding: 12px 14px;
            font-family: inherit;
        }

        .popup-title {
            font-weight: 800;
            margin-bottom: 5px;
        }

        .popup-location {
            font-size: 12px;
            margin-bottom: 5px;
        }

        .popup-confirmations {
            font-size: 12px;
            opacity: 0.65;
        }
    </style>
</head>

<body>

<div id="app">

    <div id="map"></div>

    <!-- ================================================
         MODE CARTE LIVE
    ================================================= -->

    <div id="header">
        <div class="brand">
            🚲 RideNow Paris
        </div>

        <div class="subtitle">
            Les infos des cyclistes, en temps réel.
        </div>

        <div id="alert-count">
            Chargement…
        </div>
    </div>

    <div id="legend">
        🚧 Travaux / piste bloquée<br>
        ⚠️ Danger<br>
        💥 Accident<br>
        👮 Sécurité routière<br>
        🔥 Tendance 7 jours
    </div>

    <!-- ================================================
         MODE SELECTION
    ================================================= -->

    <div id="selector-ui">

        <div id="selector-header">

            <div id="selector-title">
                📍 Place le signalement
            </div>

            <div id="selector-subtitle">
                Déplace la carte sous le curseur
            </div>

        </div>

        <div id="center-pin">
            <div id="center-pin-icon">
                📍
            </div>

            <div id="pin-dot"></div>
        </div>

        <div id="selector-bottom">

            <div id="chosen-position">
                Déplace la carte jusqu'à l'endroit exact
            </div>

            <button id="confirm-location">
                ✅ CONFIRMER CET EMPLACEMENT
            </button>

        </div>

    </div>

    <button
        id="geo-button"
        aria-label="Ma position"
    >
        📍
    </button>

</div>


<script>

    const BOT_USERNAME = "VeloParisLiveBot";

    /* =====================================================
       PARAMETRES
    ===================================================== */

    const params = new URLSearchParams(
        window.location.search
    );

    const selectionMode =
        params.get("select") === "1";

    const selectedCategory =
        params.get("category");

    const selectedMinutes =
        parseInt(
            params.get("minutes") || "5",
            10
        );


    if (selectionMode) {
        document.body.classList.add(
            "selection-mode"
        );
    }


    /* =====================================================
       MAP
    ===================================================== */

    const map = new maplibregl.Map({

        container: "map",

        style:
            "https://tiles.openfreemap.org/styles/liberty",

        center: [
            2.3522,
            48.8566
        ],

        zoom: selectionMode ? 15 : 12.2,

        attributionControl: true

    });


    map.addControl(
        new maplibregl.NavigationControl({
            showCompass: false
        }),
        "top-right"
    );


    /* =====================================================
       UTILS
    ===================================================== */

    function emojiFromCategory(category) {

        const value =
            (category || "").toLowerCase();

        if (
            value.includes("travaux") ||
            value.includes("piste bloquée")
        ) {
            return "🚧";
        }

        if (
            value.includes("accident")
        ) {
            return "💥";
        }

        if (
            value.includes("sécurité routière") ||
            value.includes("securite routiere") ||
            value.includes("opération")
        ) {
            return "👮";
        }

        if (
            value.includes("danger")
        ) {
            return "⚠️";
        }

        return "❓";
    }


    function escapeHtml(value) {

        return String(value || "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }


    /* =====================================================
       GEOLOCATION
    ===================================================== */

    const geoButton =
        document.getElementById("geo-button");


    geoButton.addEventListener(
        "click",
        () => {

            if (!navigator.geolocation) {
                alert(
                    "La géolocalisation n'est pas disponible."
                );
                return;
            }

            geoButton.textContent = "⌛";

            navigator.geolocation.getCurrentPosition(

                (position) => {

                    const longitude =
                        position.coords.longitude;

                    const latitude =
                        position.coords.latitude;

                    map.flyTo({
                        center: [
                            longitude,
                            latitude
                        ],

                        zoom: selectionMode
                            ? 17
                            : 15
                    });

                    geoButton.textContent = "📍";
                },

                () => {

                    geoButton.textContent = "📍";

                    alert(
                        "Impossible de récupérer ta position."
                    );
                },

                {
                    enableHighAccuracy: true,
                    timeout: 8000,
                    maximumAge: 30000
                }

            );

        }
    );


    /*
    En mode sélection :
    on essaie automatiquement de centrer la carte
    sur l'utilisateur.
    */

    if (
        selectionMode &&
        navigator.geolocation
    ) {

        navigator.geolocation.getCurrentPosition(

            (position) => {

                map.jumpTo({

                    center: [
                        position.coords.longitude,
                        position.coords.latitude
                    ],

                    zoom: 16

                });

            },

            () => {
                // On reste centré sur Paris.
            },

            {
                enableHighAccuracy: true,
                timeout: 5000,
                maximumAge: 60000
            }

        );

    }


    /* =====================================================
       MODE SELECTION
    ===================================================== */

    if (selectionMode) {

        const chosenPosition =
            document.getElementById(
                "chosen-position"
            );

        const confirmButton =
            document.getElementById(
                "confirm-location"
            );


        function updateCenterLabel() {

            const center =
                map.getCenter();

            chosenPosition.textContent =
                center.lat.toFixed(5) +
                ", " +
                center.lng.toFixed(5);

        }


        map.on(
            "moveend",
            updateCenterLabel
        );


        map.on(
            "load",
            updateCenterLabel
        );


        confirmButton.addEventListener(
            "click",
            () => {

                if (!selectedCategory) {

                    alert(
                        "Catégorie manquante. Relance le signalement depuis Telegram."
                    );

                    return;
                }


                const allowedCategories = [
                    "works",
                    "danger",
                    "accident",
                    "road_safety",
                    "other"
                ];


                if (
                    !allowedCategories.includes(
                        selectedCategory
                    )
                ) {

                    alert(
                        "Catégorie incorrecte."
                    );

                    return;
                }


                if (
                    ![5, 15, 30, 60].includes(
                        selectedMinutes
                    )
                ) {

                    alert(
                        "Délai incorrect."
                    );

                    return;
                }


                const center =
                    map.getCenter();


                const latitude =
                    center.lat.toFixed(5);

                const longitude =
                    center.lng.toFixed(5);


                /*
                Telegram autorise un petit payload "start".
                Format :

                loc_category_minutes_lat_lon
                */

                const payload =
                    "loc_" +
                    selectedCategory +
                    "_" +
                    selectedMinutes +
                    "_" +
                    latitude +
                    "_" +
                    longitude;


                const telegramURL =
                    "https://t.me/" +
                    BOT_USERNAME +
                    "?start=" +
                    encodeURIComponent(payload);


                confirmButton.disabled = true;

                confirmButton.textContent =
                    "↗️ RETOUR VERS RIDENOW…";


                window.location.href =
                    telegramURL;

            }
        );

    }


    /* =====================================================
       LIVE MARKERS
    ===================================================== */

    let markers = [];


    function clearMarkers() {

        markers.forEach(
            marker => marker.remove()
        );

        markers = [];

    }


    async function loadAlerts() {

        /*
        En mode sélection, on ne charge pas
        les marqueurs live pour garder l'écran propre.
        */

        if (selectionMode) {
            return;
        }


        try {

            const response =
                await fetch("/api/alerts");


            const data =
                await response.json();


            const alerts =
                data.alerts || [];


            document.getElementById(
                "alert-count"
            ).textContent =
                alerts.length +
                " alerte(s) active(s)";


            clearMarkers();


            for (const alertData of alerts) {

                const element =
                    document.createElement(
                        "div"
                    );


                element.className =
                    "alert-marker";


                element.textContent =
                    emojiFromCategory(
                        alertData.category
                    );


                const popup =
                    new maplibregl.Popup({
                        offset: 24
                    })
                    .setHTML(
                        `
                        <div class="popup-title">
                            ${escapeHtml(alertData.category)}
                        </div>

                        <div class="popup-location">
                            📍 ${escapeHtml(alertData.location_name)}
                        </div>

                        <div class="popup-confirmations">
                            ✅ ${alertData.confirmations || 0} confirmation(s)
                        </div>
                        `
                    );


                const marker =
                    new maplibregl.Marker({
                        element
                    })
                    .setLngLat([
                        alertData.longitude,
                        alertData.latitude
                    ])
                    .setPopup(
                        popup
                    )
                    .addTo(
                        map
                    );


                markers.push(
                    marker
                );

            }

        }

        catch (error) {

            console.error(
                "Erreur alertes :",
                error
            );

            document.getElementById(
                "alert-count"
            ).textContent =
                "Carte live indisponible";

        }

    }


    /* =====================================================
       HISTORY / HEATMAP
    ===================================================== */

    async function loadHistory() {

        if (selectionMode) {
            return;
        }


        try {

            const response =
                await fetch(
                    "/api/history"
                );


            const data =
                await response.json();


            const alerts =
                data.alerts || [];


            const now =
                Date.now();


            const features =
                alerts.map(
                    alertData => {

                        const created =
                            new Date(
                                alertData.created_at
                            ).getTime();


                        const ageHours =
                            Math.max(
                                0,
                                (
                                    now -
                                    created
                                )
                                /
                                3600000
                            );


                        /*
                        Plus c'est récent,
                        plus le poids est fort.
                        */

                        const recencyWeight =
                            Math.max(
                                0.15,
                                1 -
                                ageHours /
                                (24 * 7)
                            );


                        /*
                        Les confirmations augmentent
                        légèrement le poids.
                        */

                        const confirmationWeight =
                            Math.min(
                                2,
                                1 +
                                (
                                    alertData.confirmations
                                    || 0
                                )
                                * 0.12
                            );


                        return {

                            type:
                                "Feature",

                            geometry: {

                                type:
                                    "Point",

                                coordinates: [
                                    alertData.longitude,
                                    alertData.latitude
                                ]

                            },

                            properties: {

                                weight:
                                    recencyWeight
                                    *
                                    confirmationWeight

                            }

                        };

                    }
                );


            const geojson = {

                type:
                    "FeatureCollection",

                features

            };


            if (
                map.getSource(
                    "history"
                )
            ) {

                map.getSource(
                    "history"
                )
                .setData(
                    geojson
                );

                return;
            }


            map.addSource(
                "history",
                {

                    type:
                        "geojson",

                    data:
                        geojson

                }
            );


            map.addLayer(
                {

                    id:
                        "history-heat",

                    type:
                        "heatmap",

                    source:
                        "history",

                    maxzoom:
                        17,

                    paint: {

                        "heatmap-weight": [
                            "interpolate",
                            ["linear"],
                            ["get", "weight"],
                            0,
                            0,
                            2,
                            1
                        ],

                        "heatmap-intensity": [
                            "interpolate",
                            ["linear"],
                            ["zoom"],
                            10,
                            0.7,
                            15,
                            1.4
                        ],

                        "heatmap-radius": [
                            "interpolate",
                            ["linear"],
                            ["zoom"],
                            10,
                            18,
                            15,
                            35
                        ],

                        "heatmap-opacity": [
                            "interpolate",
                            ["linear"],
                            ["zoom"],
                            10,
                            0.55,
                            17,
                            0.2
                        ]

                    }

                }
            );

        }

        catch (error) {

            console.error(
                "Erreur historique :",
                error
            );

        }

    }


    /* =====================================================
       START
    ===================================================== */

    map.on(
        "load",
        () => {

            if (!selectionMode) {

                loadAlerts();

                loadHistory();


                /*
                Alertes live toutes les 15 secondes.
                */

                setInterval(
                    loadAlerts,
                    15000
                );


                /*
                Historique toutes les 5 minutes.
                */

                setInterval(
                    loadHistory,
                    300000
                );

            }

        }
    );

</script>

</body>
</html>
